name: package-windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"

      - name: Create virtualenv and install build deps
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\pip install -e . pyinstaller

      - name: Build frontend and executable
        shell: pwsh
        run: .venv\Scripts\python tools/build_galaxy.py

      - uses: actions/upload-artifact@v4
        with:
          name: zhiye-galaxy
          path: |
            dist/ZhiYeGalaxy.exe
            reports/A/galaxy-build.json
          if-no-files-found: error
